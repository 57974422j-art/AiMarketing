<!DOCTYPE html>
<html><head><title>坐标获取</title>
<style>
body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;color:#fff;font-family:monospace}
h2{color:#10b981;margin:10px}
#info{position:fixed;top:10px;right:10px;background:#000c;color:#0f0;padding:8px 14px;border-radius:8px;font-size:14px;z-index:99}
img{max-width:95vw;cursor:crosshair;border:1px solid #333;border-radius:8px}
.toolbar{display:flex;gap:10px;margin:10px;align-items:center;flex-wrap:wrap;justify-content:center}
select,input,button{padding:6px 12px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;font-size:14px}
button{background:#10b981;border-color:#10b981;cursor:pointer;font-weight:bold}
button:hover{background:#059669}
label{color:#888;font-size:12px}
</style></head>
<body>
<h2>点击图片获取坐标</h2>
<div class="toolbar">
  <label>设备ID:</label>
  <input id="devId" type="number" value="2" style="width:60px" />
  <button id="fetchBtn">📸 实时截图</button>
  <label>或上传图片:</label>
  <input id="upload" type="file" accept="image/png,image/jpeg" />
  <span id="loading" style="color:#f59e0b;display:none">截图中...</span>
</div>
<div id="info">x: 0, y: 0</div>
<img id="pic" src="/douyin_play.png" crossorigin="anonymous" />
<script>
const img=document.getElementById('pic')
const info=document.getElementById('info')
const devId=document.getElementById('devId')
const fetchBtn=document.getElementById('fetchBtn')
const upload=document.getElementById('upload')
const loading=document.getElementById('loading')

img.onclick=function(e){
  if (!img.naturalWidth) return
  const rect=img.getBoundingClientRect()
  const scaleX=img.naturalWidth/rect.width
  const scaleY=img.naturalHeight/rect.height
  const x=Math.round((e.clientX-rect.left)*scaleX)
  const y=Math.round((e.clientY-rect.top)*scaleY)
  info.textContent=`x: ${x}, y: ${y} | ${img.naturalWidth}×${img.naturalHeight}`
  navigator.clipboard.writeText(`${x},${y}`).catch(()=>{})
}

fetchBtn.onclick=async function(){
  const id=devId.value || 2
  loading.style.display='inline'
  fetchBtn.disabled=true
  try {
    const r=await fetch('/api/devices/'+id+'/screenshot',{credentials:'include'})
    if (!r.ok) { alert('截图失败: '+r.status); return }
    const blob=await r.blob()
    const url=URL.createObjectURL(blob)
    img.src=url
    img.onload=()=>{ info.textContent=`已加载实时截图` }
  } catch(e) { alert('截图失败: '+e.message) }
  finally { loading.style.display='none'; fetchBtn.disabled=false }
}

upload.onchange=function(e){
  const file=e.target.files[0]
  if (!file) return
  const url=URL.createObjectURL(file)
  img.src=url
  img.onload=()=>{ info.textContent=`已加载: ${file.name} (${img.naturalWidth}×${img.naturalHeight})` }
}
</script>
</body></html>
