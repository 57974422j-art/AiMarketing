<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280, height=720" />
<title>video seek 测试 · 3s</title>
<script src="./gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; overflow:hidden; }
  /* 洋红底 = 诊断色：视频若没加载/没绘制，画面就是洋红，一眼可辨（不会与 T0..T7 纯色混淆） */
  #stage { position:relative; width:1280px; height:720px; overflow:hidden; background:#FF00FF; }
  /* ★ .clip 会被引擎移出文档流 → 必须自己写死绝对坐标（见 REPORT.md §4 坑①） */
  #v { position:absolute; left:0; top:0; width:1280px; height:720px; object-fit:contain; background:#FF00FF; }
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="3"
     data-fps="25" data-width="1280" data-height="720">
  <!-- 故意不加 loop：loop 会把"seek 错位"掩盖成"看起来正常" -->
  <video id="v" class="clip" data-start="0" data-duration="3" data-track-index="0"
         src="probe-seek.mp4" muted playsinline preload="auto"></video>
</div>
<script>
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
