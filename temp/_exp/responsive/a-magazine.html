<!doctype html>
<html lang="zh-CN">
<!--
  ===========================================================================
  a-magazine.html · 风格 A「杂志 / 纸感」  —— 响应式实验（不改引擎源码）
  ---------------------------------------------------------------------------
  【图片槽位】(全部用 CSS 渐变占位；塞真实素材时只改 .slot--hero 的 background)
    · slot-1  class="slot slot--hero"   主视觉
        意图：本期封面大图（一碗汤 / 后厨 / 街景，带一点暗部好压白字图注）
        建议比例：竖屏 4:5（竖构图）· 横屏 3:2（横构图）——同一张图按两种裁切都能用
        建议最小边：长边 ≥ 1200px（横屏下会被拉宽）
        图注：白字压在渐变暗部上，超长自动 line-clamp:2 截断
  【布局口径】全页 **零 position:absolute / 零 left|top 定位**。
    排版 = grid 行骨架 + flex-wrap（靠 flex-basis 决定"窄堆叠 / 宽分栏"）+ clamp()/vmin 字号。
  【时间轴】JS 接口 window.__seek(t)：t 秒 → 逐元素写入 CSS 变量 --e(0→1) 驱动入场；
    无随机、无 Date.now、无网络、无自动播放的无限动画。默认 --e:1 ⇒ 无 JS 也不空白。
============================================================================ -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A · 杂志纸感（响应式实验）</title>
<style>
  :root{
    --paper:#F4F1EA; --paper2:#E9E2D5; --ink:#16130F; --dim:#5E574C; --accent:#B4552F;
    --rule:rgba(22,19,15,.18);
    --gap:clamp(14px, 2.4vmin, 30px);
    --pad:clamp(22px, 5vmin, 68px);
    --e:1;            /* 入场进度（__seek 写入；默认 1 保证无 JS 时内容可见） */
    --rise:16px;      /* 入场位移，仅 transform，不参与布局 */
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    overflow:hidden; color:var(--ink);
    font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    background:
      repeating-linear-gradient(0deg, rgba(22,19,15,.020) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(120% 90% at 50% -20%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
      linear-gradient(170deg, var(--paper) 0%, var(--paper2) 100%);
  }
  .stage{
    width:100vw; height:100vh; height:100dvh;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;   /* 页眉 / 主区(可压缩) / 页脚 */
    gap:var(--gap);
    padding:var(--pad);
  }
  /* 入场：只动 opacity/transform */
  [data-at]{ opacity:var(--e,1); transform:translateY(calc((1 - var(--e,1)) * var(--rise))); }

  /* ---------------- 页眉 ---------------- */
  .masthead{ display:flex; align-items:baseline; gap:clamp(10px,2vmin,24px); flex-wrap:wrap; min-width:0; }
  .masthead .hair{ flex:1 1 40px; min-width:24px; height:1px; background:var(--rule); align-self:center; }
  .eyebrow{
    font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;
    font-size:clamp(11px,1.5vmin,15px); letter-spacing:.34em; text-transform:uppercase; color:var(--accent);
  }
  .issue{ font-family:system-ui,sans-serif; font-size:clamp(11px,1.5vmin,15px); letter-spacing:.2em; color:var(--dim); }

  /* ---------------- 主区：窄→堆叠，宽→分栏（纯 flex-wrap，无媒体查询） ---------------- */
  .hero{
    display:flex; flex-wrap:wrap;
    gap:calc(var(--gap) * 1.4);
    align-items:center; align-content:center; min-height:0;
  }
  .copy{ flex:1 1 24rem; min-width:0; display:grid; gap:clamp(10px,1.8vmin,20px); align-content:center; }
  .kicker{ font-family:system-ui,sans-serif; font-size:clamp(12px,1.7vmin,16px); letter-spacing:.3em; color:var(--dim); }
  h1{
    font-size:clamp(38px, 9vmin, 86px); line-height:1.08; font-weight:700; letter-spacing:.01em;
    overflow-wrap:anywhere; text-wrap:balance;
  }
  h1 em{ font-style:normal; color:var(--accent); }
  .dek{
    font-size:clamp(15px,2.3vmin,22px); line-height:1.62; color:var(--dim);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden;
  }

  /* ---------------- 图片槽位 ---------------- */
  .slot{ flex:1 1 24rem; min-width:0; }
  .slot--hero{
    display:flex; flex-direction:column; justify-content:flex-end;   /* 图注压底，不用绝对定位 */
    padding:clamp(12px,2.4vmin,22px);
    aspect-ratio:4/5; max-height:min(58vh,100%);
    border:1px solid var(--rule); border-radius:2px; overflow:hidden;
    background:
      radial-gradient(70% 60% at 30% 25%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
      linear-gradient(150deg, #C9B79A 0%, #9A7F5F 45%, #4E3B2A 100%);
  }
  /* 横屏：同一素材换横构图（这是本页唯一一条媒体查询，只改“比例/方向”，不改任何像素坐标） */
  @media (min-aspect-ratio:1/1){
    .slot--hero{ aspect-ratio:3/2; max-height:min(72vh,100%); }
  }
  .cap{
    font-family:system-ui,sans-serif; color:#F8F4ED;
    font-size:clamp(11px,1.6vmin,15px); line-height:1.55; letter-spacing:.03em;
    text-shadow:0 1px 6px rgba(0,0,0,.5);
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;  /* 超长图注截断 */
  }

  /* ---------------- 页脚 chips ---------------- */
  .chips{
    display:flex; flex-wrap:wrap; align-items:center; gap:clamp(8px,1.6vmin,16px);
    min-width:0; border-top:1px solid var(--rule); padding-top:clamp(10px,1.8vmin,20px);
  }
  .chip{
    font-family:system-ui,sans-serif; font-size:clamp(11px,1.6vmin,15px); letter-spacing:.05em;
    color:var(--dim); border:1px solid var(--rule); border-radius:999px;
    padding:clamp(5px,1vmin,9px) clamp(10px,2vmin,16px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:100%;
  }
  .chip b{ color:var(--ink); font-weight:600; }
  .chip--accent{ color:#7A3418; border-color:rgba(180,85,47,.45); background:rgba(180,85,47,.07); }
</style>
</head>
<body>
<div class="stage" id="stage" data-composition-id="main" data-start="0" data-duration="6" data-fps="25">

  <header class="masthead" data-at="0.00" data-dur="0.6">
    <span class="eyebrow">City&nbsp;Flavor</span>
    <span class="issue">第 07 期 · 2026 秋</span>
    <span class="hair"></span>
  </header>

  <main class="hero">
    <div class="copy">
      <div class="kicker" data-at="0.25" data-dur="0.6">封面故事 / 夜宵</div>
      <h1 data-at="0.40" data-dur="0.7">凌晨四点，<em>一碗汤</em>开始的地方</h1>
      <p class="dek" data-at="0.85" data-dur="0.7">城市睡下之后，有人才开始点火。我们跟了三个月的夜班后厨，记录从骨头下锅到第一碗汤上桌的全部过程，也记录了那些不肯换手艺的人。</p>
    </div>

    <figure class="slot slot--hero" data-at="0.10" data-dur="0.8">
      <figcaption class="cap">封面：凌晨四点的后厨，第一锅牛骨汤刚滚开。汤面上那层金黄的油花，是这一期所有故事开始的地方——从选骨、焯水、撇沫到慢炖，一共十七道工序，没有一道可以省。</figcaption>
    </figure>
  </main>

  <footer class="chips">
    <span class="chip" data-at="1.15" data-dur="0.6">采访 <b>4</b> 家老店</span>
    <span class="chip" data-at="1.30" data-dur="0.6">耗时 <b>3</b> 个月</span>
    <span class="chip chip--accent" data-at="1.45" data-dur="0.6">共 <b>17</b> 道工序</span>
    <span class="chip" data-at="1.60" data-dur="0.6">摄影 · 林述 · 35mm 定焦 · 全部现场光拍摄</span>
  </footer>

</div>

<script>
(function () {
  var DUR = 6;
  var els = [].slice.call(document.querySelectorAll('[data-at]'));
  /* ease-out cubic：纯函数、可复现（无随机/无时间戳） */
  function ease(p) { return 1 - Math.pow(1 - p, 3); }
  function seek(t) {
    t = Math.min(DUR, Math.max(0, Number(t) || 0));
    document.documentElement.style.setProperty('--seek', t);
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var at = parseFloat(el.getAttribute('data-at')) || 0;
      var d = parseFloat(el.getAttribute('data-dur')) || 0.7;
      var p = Math.min(1, Math.max(0, (t - at) / d));
      el.style.setProperty('--e', ease(p).toFixed(4));
    }
  }
  window.__seek = seek;
  window.__DURATION__ = DUR;
  /* 兼容 html-deck 引擎的时间线注册（键 = data-composition-id） */
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = { seek: seek, duration: function () { return DUR; }, pause: function () {}, play: function () {} };
  seek(0);
})();
</script>
</body>
</html>
