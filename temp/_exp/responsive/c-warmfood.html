<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>暖食段 · 规范 v1 样本（c-warmfood）</title>
<!--
  图片槽位（当前全部为 CSS 渐变占位；真图到位后把 background-image 换成 url(...) 即可）：
  1. 主视觉 · 铜锅炭火（4:3，cover）—— 满幅暖光，交代"这一桌"
  2. 菜品 · 手切鲜羊肉（1:1，cover）
  3. 菜品 · 冰盘虾滑（1:1，cover）
  4. 菜品 · 黑千层毛肚（1:1，cover）
  段契约：<section class="sec" data-seg="4" data-start="0" data-duration="3.2" data-place="cover" data-form="overlay">
  时间轴：window.__seek(t)，t=0 为完整静止画面（所有元素可见，只是"未推入"状态）
-->
<style>
  :root{
    /* L0 皮肤：暖食（米黄纸底 + 焦糖橙强调） */
    --bg:#FBF3E6; --bg2:#F4E3CB; --ink:#2A1C12; --dim:#6B5745; --accent:#C2410C; --accent2:#E8A33D;
    --p:0;                                  /* 时间轴进度（由 __seek 写） */
    --gap: clamp(14px, 2.1vmin, 26px);
    --pad: clamp(20px, 3.2vmin, 44px);
    --r: clamp(14px, 2.2vmin, 26px);        /* 圆角（非布局量，可用 px/vmin） */
    --title: clamp(40px, 6.4vmin, 76px);    /* R3：竖屏主标题 ≥40px */
    --lead: clamp(22px, 2.7vmin, 31px);     /* R3：正文 ≥22px */
    --label: 22px;                          /* R3：标签 =22px，不下探 */
    --value: clamp(26px, 3.2vmin, 38px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(115% 88% at 80% 6%, var(--bg2) 0%, var(--bg) 60%);
    color:var(--ink); overflow:hidden;
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── R1 一屏一段：整段就是一个 grid，不滚动 ── */
  .sec{
    width:100%; height:100%; padding:var(--pad); gap:var(--gap);
    display:grid;
    /* 竖屏：上文字 / 中主视觉 / 下拼图 / 底指标条（R4：底部 20% 有内容） */
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1.25fr) minmax(0,1fr) auto;
    grid-template-areas:"text" "main" "tiles" "kpis";
  }
  /* 横屏：左字列 / 右图列（主视觉+拼图）/ 底指标条通栏（R4：底部 40% 有内容） */
  @media (min-aspect-ratio: 1/1){
    .sec{
      grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);
      grid-template-rows:minmax(0,1fr) minmax(0,0.6fr) auto;
      grid-template-areas:"text main" "text tiles" "kpis kpis";
    }
  }

  .text{grid-area:text; display:flex; flex-direction:column; gap:var(--gap); min-width:0}
  .chip{
    align-self:flex-start; display:inline-flex; align-items:center; gap:10px;
    padding:8px 16px; border-radius:999px; background:rgba(194,65,12,.10);
    color:var(--accent); font-size:var(--label); font-weight:700; letter-spacing:.06em;
  }
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
  h1{font-size:var(--title); line-height:1.08; letter-spacing:.01em; font-weight:900}
  h1 em{
    font-style:normal;
    background:linear-gradient(transparent 62%, rgba(232,163,61,.55) 62%);
    padding:0 .12em;
  }
  .lead{font-size:var(--lead); line-height:1.6; color:var(--dim); max-width:34ch}
  .spacer{flex:1 1 auto; min-height:0}

  /* ── 图槽（R7 素材槽位；R5 文字不压图：文字一律在图外 ── */
  .frame{position:relative; border-radius:var(--r); overflow:hidden;
         box-shadow:0 18px 44px rgba(64,38,16,.16); transform:scale(calc(1.035 - .035 * var(--p)));
         opacity:calc(.9 + .1 * var(--p));}
  .main{grid-area:main; min-height:0;
        background:linear-gradient(150deg,#8C3B12 0%,#C2611C 42%,#E8A33D 100%)}
  .main::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;
        background:linear-gradient(transparent,rgba(42,28,18,.34))}
  .tiles{grid-area:tiles; min-height:0; display:grid; gap:var(--gap);
         grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{border-radius:var(--r); overflow:hidden; box-shadow:0 12px 28px rgba(64,38,16,.14);
        transform:scale(calc(1.03 - .03 * var(--p))); opacity:calc(.9 + .1 * var(--p))}
  .t1{background:linear-gradient(160deg,#A8442A 0%,#D98545 100%)}
  .t2{background:linear-gradient(160deg,#C7B29A 0%,#EFE1CC 100%)}
  .t3{background:linear-gradient(160deg,#5E4632 0%,#9A7A56 100%)}

  .kpis{grid-area:kpis; display:grid; gap:var(--gap); grid-template-columns:repeat(3,minmax(0,1fr));
        padding-top:var(--gap); border-top:1px solid rgba(107,87,69,.22)}
  .kpi{display:flex; flex-direction:column; gap:6px; opacity:calc(.92 + .08 * var(--p))}
  .kpi b{font-size:var(--value); font-weight:900; color:var(--accent)}
  .kpi span{font-size:var(--label); color:var(--dim)}
</style>
</head>
<body>
  <section class="sec" data-seg="4" data-start="0" data-duration="3.2" data-place="cover" data-form="overlay">
    <div class="text">
      <span class="chip"><i></i>京味涮肉 · 铜锅炭火</span>
      <h1>一桌<em>滚烫</em><br />从铜锅开始</h1>
      <p class="lead">清汤一盏，羊肉立盘不掉；虾滑冰碗盛装，毛肚七上八下。</p>
      <div class="spacer"></div>
    </div>

    <div class="frame main"></div>

    <div class="tiles">
      <div class="frame tile t1"></div>
      <div class="frame tile t2"></div>
      <div class="frame tile t3"></div>
    </div>

    <div class="kpis">
      <div class="kpi"><b>立盘不掉</b><span>手切鲜羊肉</span></div>
      <div class="kpi"><b>冰碗盛装</b><span>虾滑配紫苏</span></div>
      <div class="kpi"><b>七上八下</b><span>黑千层毛肚</span></div>
    </div>
  </section>

<script>
  /* 确定性时间轴：t=0 时画面已完整（元素全部可见），随 t 做轻微推入/浮现。
     不用 requestAnimationFrame、不用随机、不联网 —— 渲染器给多少 t 就画多少。 */
  window.__seek = function (t) {
    var DUR = 3.2
    var p = Math.max(0, Math.min(1, (Number(t) || 0) / DUR))
    document.documentElement.style.setProperty('--p', p)
  }
  window.__seek(0)
</script>
</body>
</html>
