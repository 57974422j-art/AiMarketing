<!doctype html>
<html lang="zh-CN">
<!--
  ===========================================================================
  b-hud.html · 风格 B「深色科技 HUD」  —— 响应式实验（不改引擎源码）
  ---------------------------------------------------------------------------
  【图片槽位】本页 **不需要位图**：主视觉是内联 SVG 环形仪表（可缩放的矢量，天然响应式）。
    若要塞一张图当背景，槽位在此：class="stage" 的第一层 background（现为网格+光晕渐变）
      意图：深色机房 / 城市夜景 / 数据流（低对比、大面积暗部）
      建议比例：竖屏 9:16 · 横屏 16:9（做背景需保证中部不抢环形的读性）
      建议最小边：长边 ≥ 1600px
  【布局口径】全页 **零 position:absolute / 零 left|top 定位**。
    网格底纹=CSS repeating-linear-gradient 背景；环形=内联 SVG（viewBox 缩放 + SVG <text> 打数字）；
    强调线=真实 flex 子元素 <i>。装饰一律不参与定位。
  【时间轴】JS 接口 window.__seek(t)：t 秒 → 逐元素写 CSS 变量 --e(0→1)；
    无随机、无 Date.now、无网络（无外链字体/CDN）、无自动播放的无限动画。
============================================================================ -->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>B · 深色科技 HUD（响应式实验）</title>
<style>
  :root{
    --bg:#05070B; --panel:rgba(12,22,32,.72); --line:rgba(120,200,255,.16);
    --ink:#E8F6FF; --dim:#8AA6BC; --accent:#39F2C8; --accent2:#4D8DFF;
    --cell:clamp(26px, 3.6vmin, 44px);
    --gap:clamp(14px, 2.4vmin, 32px);
    --pad:clamp(22px, 5vmin, 64px);
    --e:1; --rise:14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    overflow:hidden; color:var(--ink);
    font-family:system-ui,-apple-system,"Microsoft YaHei","Noto Sans SC",sans-serif;
    background:#05070B;
  }
  .stage{
    width:100vw; height:100vh; height:100dvh;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    gap:var(--gap);
    padding:var(--pad);
    background:
      repeating-linear-gradient(0deg, rgba(90,200,255,.055) 0 1px, rgba(0,0,0,0) 1px var(--cell)),
      repeating-linear-gradient(90deg, rgba(90,200,255,.055) 0 1px, rgba(0,0,0,0) 1px var(--cell)),
      radial-gradient(120% 90% at 12% -10%, rgba(57,242,200,.12), rgba(0,0,0,0) 55%),
      radial-gradient(110% 90% at 105% 110%, rgba(77,141,255,.16), rgba(0,0,0,0) 60%),
      var(--bg);
  }
  [data-at]{ opacity:var(--e,1); transform:translateY(calc((1 - var(--e,1)) * var(--rise))); }

  /* ---------------- 顶栏 ---------------- */
  .topbar{ display:flex; align-items:center; gap:clamp(10px,2vmin,22px); flex-wrap:wrap; min-width:0; }
  .tag{
    display:inline-flex; align-items:center; gap:.5em;
    font-size:clamp(11px,1.5vmin,15px); letter-spacing:.26em; text-transform:uppercase;
    color:var(--accent); border:1px solid rgba(57,242,200,.4); border-radius:999px;
    padding:clamp(4px,.9vmin,8px) clamp(9px,1.8vmin,15px); background:rgba(57,242,200,.06);
  }
  .dot{ width:.5em; height:.5em; border-radius:50%; background:var(--accent); }
  .node{ font-size:clamp(11px,1.5vmin,15px); letter-spacing:.2em; color:var(--dim); font-variant-numeric:tabular-nums; }
  .bar{ flex:1 1 40px; min-width:26px; height:2px; background:linear-gradient(90deg, rgba(57,242,200,.85), rgba(77,141,255,.25)); }

  /* ---------------- 主区：窄→环在上文案在下；宽→环左文右（纯 flex-wrap） ---------------- */
  .main{
    display:flex; flex-wrap:wrap; gap:calc(var(--gap) * 1.4);
    align-items:center; align-content:center; min-height:0;
  }
  .ringbox{ flex:1 1 22rem; min-width:0; }
  .ring{ display:block; width:100%; height:auto; }
  .copy{ flex:1 1 30rem; min-width:0; display:grid; gap:clamp(10px,1.9vmin,22px); align-content:center; }
  .kicker{ font-size:clamp(11px,1.6vmin,15px); letter-spacing:.3em; color:var(--accent); text-transform:uppercase; }
  h1{
    font-size:clamp(34px, 7.6vmin, 74px); line-height:1.1; font-weight:800; letter-spacing:.01em;
    overflow-wrap:anywhere; text-wrap:balance;
  }
  .sub{ font-size:clamp(14px,2.1vmin,20px); line-height:1.6; color:var(--dim); }

  .rows{ display:grid; gap:clamp(6px,1.2vmin,12px); border-top:1px solid var(--line); padding-top:clamp(8px,1.6vmin,16px); }
  .row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; min-width:0; }
  .row .k{ font-size:clamp(12px,1.8vmin,17px); color:var(--dim); letter-spacing:.04em; min-width:0;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .v{ font-size:clamp(15px,2.4vmin,24px); font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row .v span{ font-size:.66em; color:var(--accent); margin-left:.28em; }

  /* ---------------- 页脚 chips ---------------- */
  .foot{ display:flex; flex-wrap:wrap; align-items:center; gap:clamp(7px,1.5vmin,14px);
         min-width:0; border-top:1px solid var(--line); padding-top:clamp(9px,1.7vmin,18px); }
  .chip{
    font-size:clamp(10px,1.5vmin,14px); letter-spacing:.1em; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:clamp(4px,.9vmin,8px) clamp(9px,1.7vmin,15px);
    background:var(--panel); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; max-width:100%;
  }
  .chip b{ color:var(--accent); font-weight:700; }

  /* ---------------- 内联 SVG 环形仪表（viewBox 缩放：天然响应式） ---------------- */
  .ring .track{ stroke:rgba(120,200,255,.14); }
  .ring .arc{ stroke:var(--accent); }
  .ring .ticks{ stroke:rgba(120,200,255,.30); }
  .ring .num{ fill:var(--ink); font-size:40px; font-weight:800; letter-spacing:-1px;
              font-family:system-ui,"Microsoft YaHei",sans-serif; }
  .ring .unit{ fill:var(--accent); font-size:11px; letter-spacing:2.4px;
               font-family:system-ui,"Microsoft YaHei",sans-serif; }
  .ring .cap{ fill:var(--dim); font-size:10px; letter-spacing:1.6px;
              font-family:system-ui,"Microsoft YaHei",sans-serif; }
</style>
</head>
<body>
<div class="stage" id="stage" data-composition-id="main" data-start="0" data-duration="6" data-fps="25">

  <header class="topbar" data-at="0.00" data-dur="0.6">
    <span class="tag"><i class="dot"></i>sys // live</span>
    <span class="node">NODE-07 · SHANGHAI-EDGE</span>
    <span class="bar"></span>
  </header>

  <main class="main">
    <div class="ringbox" data-at="0.20" data-dur="0.9">
      <svg class="ring" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="拦截率 99.98%">
        <!-- 外圈刻度：靠 stroke-dasharray 画，不依赖任何像素坐标 -->
        <circle class="ticks" cx="100" cy="100" r="94" fill="none" stroke-width="3" stroke-dasharray="1 7" />
        <circle class="track" cx="100" cy="100" r="80" fill="none" stroke-width="7" />
        <!-- 2πr = 502.65；99.98% ⇒ 缺口约 0.1 -->
        <circle class="arc" cx="100" cy="100" r="80" fill="none" stroke-width="7" stroke-linecap="round"
                stroke-dasharray="502.65" stroke-dashoffset="1.1" transform="rotate(-90 100 100)" />
        <circle class="track" cx="100" cy="100" r="62" fill="none" stroke-width="1" stroke-dasharray="3 7" />
        <text class="num" x="100" y="99" text-anchor="middle">99.98</text>
        <text class="unit" x="100" y="121" text-anchor="middle">% 拦截率</text>
        <text class="cap" x="100" y="150" text-anchor="middle">SCAN / 24H</text>
      </svg>
    </div>

    <div class="copy">
      <div class="kicker" data-at="0.35" data-dur="0.6">Realtime Risk Scan</div>
      <h1 data-at="0.50" data-dur="0.7">实时风险扫描</h1>
      <p class="sub" data-at="0.80" data-dur="0.7">边缘节点直连，12 毫秒回传；每一次命中都落到可追溯的链路图上。</p>

      <div class="rows">
        <div class="row" data-at="1.00" data-dur="0.6"><span class="k">异常请求拦截</span><span class="v">1,284,930 <span>次</span></span></div>
        <div class="row" data-at="1.15" data-dur="0.6"><span class="k">平均判定时延</span><span class="v">12 <span>ms</span></span></div>
        <div class="row" data-at="1.30" data-dur="0.6"><span class="k">在线边缘节点</span><span class="v">1,284 <span>台</span></span></div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <span class="chip" data-at="1.50" data-dur="0.6">模型 <b>v4.2</b> · 增量 <b>每天</b></span>
    <span class="chip" data-at="1.62" data-dur="0.6">可用性 <b>99.99%</b></span>
    <span class="chip" data-at="1.74" data-dur="0.6">全链路审计日志保留 <b>180 天</b></span>
  </footer>

</div>

<script>
(function () {
  var DUR = 6;
  var els = [].slice.call(document.querySelectorAll('[data-at]'));
  function ease(p) { return 1 - Math.pow(1 - p, 3); }
  function seek(t) {
    t = Math.min(DUR, Math.max(0, Number(t) || 0));
    document.documentElement.style.setProperty('--seek', t);
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var at = parseFloat(el.getAttribute('data-at')) || 0;
      var d = parseFloat(el.getAttribute('data-dur')) || 0.7;
      var p = Math.min(1, Math.max(0, (t - at) / d));
      el.style.setProperty('--e', ease(p).toFixed(4));
    }
  }
  window.__seek = seek;
  window.__DURATION__ = DUR;
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = { seek: seek, duration: function () { return DUR; }, pause: function () {}, play: function () {} };
  seek(0);
})();
</script>
</body>
</html>
